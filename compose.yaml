# Локальная инфраструктура разработки. Порт 5434: 5432 занят другим проектом, 5433 — SSH-туннель к прод-БД.
services:
  postgres:
    image: postgres:16-alpine
    container_name: armaplayers-postgres
    environment:
      POSTGRES_USER: armaplayers
      POSTGRES_PASSWORD: armaplayers
      POSTGRES_DB: armaplayers
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armaplayers -d armaplayers"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
