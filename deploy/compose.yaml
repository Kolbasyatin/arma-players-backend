# Прод-стек: Postgres + observer. Управляется systemd-юнитом deploy/armaplayers-observer.service
# (compose up/down), перезапуск после аварий — политиками restart ниже.
# Сервис токена arma-reforger-hz работает отдельно на хосте (127.0.0.1:8080) — из контейнера
# он виден как host.docker.internal:8080. Секреты — в deploy/.env (не в git).
services:
  postgres:
    image: postgres:16-alpine
    container_name: armaplayers-postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      POSTGRES_USER: armaplayers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в deploy/.env}
      POSTGRES_DB: armaplayers
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Раскомментируй, чтобы ходить в БД с хоста через psql localhost:5433.
    # ports:
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armaplayers -d armaplayers"]
      interval: 10s
      timeout: 5s
      retries: 10

  observer:
    image: ghcr.io/kolbasyatin/arma-players-backend:${OBSERVER_TAG:-latest}
    container_name: armaplayers-observer
    restart: on-failure
    # Логи: stdout (docker logs, ограничен по размеру) + файл logs/observer.log (в корне каталога проекта) с ротацией —
    # лежит рядом с приложением и переживает пересоздание контейнера. Читать: tail -f logs/observer.log | jq
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - ../logs:/logs
    # uid/gid владельца каталога logs на хосте; образ distroless, пользователь внутри не нужен.
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://armaplayers:${POSTGRES_PASSWORD}@postgres:5432/armaplayers?sslmode=disable
      TOKEN_URL: ${TOKEN_URL:-http://host.docker.internal:8080/token}
      HTTP_ADDR: ":8081"
      API_TOKEN: ${API_TOKEN:-}
      # Протокольные константы Bohemia. Пробрасываются, чтобы после обновления Arma
      # версию клиента и User-Agent можно было поправить в .env, а не пересобирать образ.
      BOHEMIA_BASE_URL: ${BOHEMIA_BASE_URL:-}
      BOHEMIA_PLATFORM_ID: ${BOHEMIA_PLATFORM_ID:-}
      BOHEMIA_GAME_CLIENT_TYPE: ${BOHEMIA_GAME_CLIENT_TYPE:-}
      BOHEMIA_CLIENT_VERSION: ${BOHEMIA_CLIENT_VERSION:-}
      BOHEMIA_USER_AGENT: ${BOHEMIA_USER_AGENT:-}
      LOBBY_SCAN_RETRY: ${LOBBY_SCAN_RETRY:-15m}
      LOBBY_PAGE_SIZE: ${LOBBY_PAGE_SIZE:-500}
      RETENTION_INTERVAL: ${RETENTION_INTERVAL:-1h}
      ROLLUP_INTERVAL: ${ROLLUP_INTERVAL:-1h}
      ROLLUP_OVERLAP: ${ROLLUP_OVERLAP:-3h}
      ROLLUP_OVERLAP_DAYS: ${ROLLUP_OVERLAP_DAYS:-2}
      OBSERVATION_RETENTION: ${OBSERVATION_RETENTION:-168h}
      POLL_RUN_RETENTION: ${POLL_RUN_RETENTION:-168h}
      EVENT_RETENTION: ${EVENT_RETENTION:-168h}
      POLL_INTERVAL: ${POLL_INTERVAL:-1m}
      POLL_CONCURRENCY: ${POLL_CONCURRENCY:-4}
      TRACK_HOST_ADDRESSES: ${TRACK_HOST_ADDRESSES:-}
      TRACK_AUTO_MIN_PLAYERS: ${TRACK_AUTO_MIN_PLAYERS:-0}
      TRACK_AUTO_MAX_SERVERS: ${TRACK_AUTO_MAX_SERVERS:-10}
      TRACK_AUTO_LOOKBACK: ${TRACK_AUTO_LOOKBACK:-168h}
      LOBBY_SCAN_INTERVAL: ${LOBBY_SCAN_INTERVAL:-24h}
      # Шлюз к Steam Web API (сервис arma-reforger-hz из соседнего стека, общая сеть arma-shared).
      # Пусто — сбор данных Steam выключен.
      STEAM_GATEWAY_URL: ${STEAM_GATEWAY_URL:-}
      STEAM_REFRESH_INTERVAL: ${STEAM_REFRESH_INTERVAL:-1h}
      STEAM_ACTIVE_WINDOW: ${STEAM_ACTIVE_WINDOW:-168h}
      STEAM_ACTIVE_STALENESS: ${STEAM_ACTIVE_STALENESS:-24h}
      STEAM_IDLE_STALENESS: ${STEAM_IDLE_STALENESS:-168h}
      STEAM_BATCH: ${STEAM_BATCH:-50}
      RAW_STORE: ${RAW_STORE:-off}
      RAW_RETENTION: ${RAW_RETENTION:-48h}
      PRESENCE_ABSENT_CONFIRMATIONS: ${PRESENCE_ABSENT_CONFIRMATIONS:-2}
      PRESENCE_MAX_GAP: ${PRESENCE_MAX_GAP:-15m}
      LOG_FILE: /logs/observer.log
      LOG_MAX_SIZE_MB: ${LOG_MAX_SIZE_MB:-50}
      LOG_MAX_BACKUPS: ${LOG_MAX_BACKUPS:-10}
      LOG_MAX_AGE_DAYS: ${LOG_MAX_AGE_DAYS:-30}
    ports:
      - "${API_BIND_ADDR:-127.0.0.1}:8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
