# Прод-стек: Postgres + observer. Управляется systemd-юнитом deploy/armaplayers-observer.service
# (compose up/down), перезапуск после аварий — политиками restart ниже.
# Сервис токена arma-reforger-hz работает отдельно на хосте (127.0.0.1:8080) — из контейнера
# он виден как host.docker.internal:8080. Секреты — в deploy/.env (не в git).
services:
  postgres:
    image: postgres:16-alpine
    container_name: armaplayers-postgres
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    environment:
      POSTGRES_USER: armaplayers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в deploy/.env}
      POSTGRES_DB: armaplayers
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Раскомментируй, чтобы ходить в БД с хоста через psql localhost:5433.
    # ports:
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armaplayers -d armaplayers"]
      interval: 10s
      timeout: 5s
      retries: 10

  observer:
    image: ghcr.io/kolbasyatin/arma-players-backend:${OBSERVER_TAG:-latest}
    container_name: armaplayers-observer
    restart: on-failure
    # Логи в journald: переживают пересоздание контейнера при обновлении, ротация — настройками journald.
    # Читать: journalctl CONTAINER_NAME=armaplayers-observer -f   (или -o cat для чистого JSON)
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://armaplayers:${POSTGRES_PASSWORD}@postgres:5432/armaplayers?sslmode=disable
      TOKEN_URL: ${TOKEN_URL:-http://host.docker.internal:8080/token}
      HTTP_ADDR: ":8081"
      POLL_INTERVAL: ${POLL_INTERVAL:-1m}
      POLL_CONCURRENCY: ${POLL_CONCURRENCY:-4}
      TRACK_HOST_ADDRESSES: ${TRACK_HOST_ADDRESSES:-}
      TRACK_AUTO_MIN_PLAYERS: ${TRACK_AUTO_MIN_PLAYERS:-0}
      TRACK_AUTO_MAX_SERVERS: ${TRACK_AUTO_MAX_SERVERS:-10}
      TRACK_AUTO_LOOKBACK: ${TRACK_AUTO_LOOKBACK:-168h}
      LOBBY_SCAN_INTERVAL: ${LOBBY_SCAN_INTERVAL:-24h}
      RAW_RETENTION: ${RAW_RETENTION:-336h}
      PRESENCE_ABSENT_CONFIRMATIONS: ${PRESENCE_ABSENT_CONFIRMATIONS:-2}
      PRESENCE_MAX_GAP: ${PRESENCE_MAX_GAP:-15m}
    ports:
      - "127.0.0.1:8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
